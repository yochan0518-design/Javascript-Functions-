<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Button Clicker</title>
</head>
<body>
    <button onclick="myfunctions(5)">Execute JS functions</button>

    <script>
        function myfunctions(x, y)
        {
            if (y==undefined) {
                y = 2;
            }
            document.write(x*y);

        }
    </script>
</body>
</html>
